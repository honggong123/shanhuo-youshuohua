# 路径 A：云服务器 + 域名 + 备案（正统方案）的 nginx 参考配置
# 放到服务器 /etc/nginx/conf.d/shanhuo.conf，替换 server_name 为你的域名

server {
    listen 80;
    server_name api.你的域名.cn;

    # HTTP 跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.你的域名.cn;

    # 证书（云厂商免费证书，下载 pem/key 后放到以下路径）
    ssl_certificate     /etc/nginx/ssl/shanhuo.pem;
    ssl_certificate_key /etc/nginx/ssl/shanhuo.key;

    # 小程序请求体较大（base64 图片）
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # 大模型生成较慢
    }
}
